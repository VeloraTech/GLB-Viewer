name: Windows Installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (for example 1.0.6; do not include the v prefix)"
        required: true
        default: "1.0.7"
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            # Keep PR/push installer artifacts aligned with the version declared
            # by the installer script instead of maintaining a second version.
            $iss = Get-Content "installer/GLB-Viewer.iss" -Raw
            if ($iss -notmatch '(?m)^\s*#define\s+AppVersion\s+"(\d+\.\d+\.\d+)"') {
              throw "Could not resolve AppVersion from installer/GLB-Viewer.iss"
            }
            $version = $Matches[1]
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use the format X.Y.Z (received: $version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows launcher
        run: rustc launcher.rs -O -o launcher.exe
      - name: Test Windows launcher lifecycle and Open With behavior
        run: node tests/test-launcher.js
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/GLB-Viewer.iss /DAppVersion=${{ steps.version.outputs.version }}
      - name: Install and smoke-test the packaged application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "GLBViewer-Packaged-Smoke"
          $installer = Join-Path $PWD "dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged installer exited with code $($process.ExitCode)."
          }

          $requiredFiles = @(
            "launcher.exe",
            "viewer.html",
            "sample/ring.glb",
            "three/build/three.module.js",
            "three/examples/jsm/loaders/GLTFLoader.js",
            "src/editor/ViewerShell.js",
            "src/core/ResourceDisposer.js",
            "scripts/update-viewer.ps1"
          )
          foreach ($relative in $requiredFiles) {
            $path = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed package is missing required file: $relative"
            }
            if ((Get-Item -LiteralPath $path).Length -lt 80) {
              throw "Installed package contains an unexpectedly small file: $relative"
            }
          }

          $registryKey = Get-Item -LiteralPath "Registry::HKEY_CLASSES_ROOT\GLBViewer\shell\open\command"
          $registeredCommand = [string]$registryKey.GetValue("")
          $expectedCommand = '"' + (Join-Path $installDir "launcher.exe") + '" "%1"'
          if ($registeredCommand -ne $expectedCommand) {
            throw "GLB Open With command is incorrect. Expected: $expectedCommand ; actual: $registeredCommand"
          }

          $env:GLB_VIEWER_EXE = Join-Path $installDir "launcher.exe"
          $env:GLB_VIEWER_SAMPLE = Join-Path $installDir "sample/ring.glb"
          $env:GLB_VIEWER_TEST = "1"
          node tests/test-launcher.js
          if ($LASTEXITCODE -ne 0) {
            throw "Installed launcher integration tests failed."
          }
      - name: Create stable latest-installer filename
        shell: pwsh
        run: Copy-Item "dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe" "dist/GLB-Viewer-Setup.exe"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLB-Viewer-Windows-Installer
          path: |
            dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe
            dist/GLB-Viewer-Setup.exe
          if-no-files-found: error
      - name: Check whether this version is already released
        id: release_guard
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $uri = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$env:RELEASE_TAG"
          try {
            Invoke-RestMethod -Uri $uri -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } | Out-Null
            "publish_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -eq 404) {
              "publish_release=true" >> $env:GITHUB_OUTPUT
              Write-Host "Release $env:RELEASE_TAG does not exist; it will be published."
            } else {
              throw
            }
          }
      - name: Create tag and publish GitHub release with installer
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && steps.release_guard.outputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: GLB Viewer ${{ steps.version.outputs.tag }}
          files: |
            dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe
            dist/GLB-Viewer-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
