name: Windows Installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows launcher
        run: rustc launcher.rs -O -o launcher.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/GLB-Viewer.iss /DAppVersion=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.1' }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLB-Viewer-Windows-Installer
          path: dist/GLB-Viewer-Setup-*.exe
          if-no-files-found: error
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GLB-Viewer-Setup-*.exe
          generate_release_notes: true
