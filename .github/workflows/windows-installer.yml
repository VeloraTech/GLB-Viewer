name: Windows Installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (for example 1.0.3; do not include the v prefix)"
        required: true
        default: "1.0.3"
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = "1.0.3"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use the format X.Y.Z (received: $version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows launcher
        run: rustc launcher.rs -O -o launcher.exe
      - name: Test Windows launcher lifecycle and Open With behavior
        run: node tests/test-launcher.js
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/GLB-Viewer.iss /DAppVersion=${{ steps.version.outputs.version }}
      - name: Create stable latest-installer filename
        shell: pwsh
        run: Copy-Item "dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe" "dist/GLB-Viewer-Setup.exe"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLB-Viewer-Windows-Installer
          path: |
            dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe
            dist/GLB-Viewer-Setup.exe
          if-no-files-found: error
      - name: Create tag and publish GitHub release with installer
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: GLB Viewer ${{ steps.version.outputs.tag }}
          files: |
            dist/GLB-Viewer-Setup-v${{ steps.version.outputs.version }}.exe
            dist/GLB-Viewer-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
